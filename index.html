<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度聯合查榜系統</title>
    <style>
        :root { --primary: #0284c7; --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #f59e0b; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; line-height: 1.5; min-height: 100vh; }
        
        .container { max-width: 800px; margin: 0 auto; width: 100%; }
        
        header { text-align: center; margin-bottom: 25px; padding-top: 10px; }
        header h1 { margin-bottom: 8px; font-size: 26px; color: var(--primary); }

        /* 模式切換 */
        .mode-switcher { display: flex; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 20px; }
        .mode-btn { flex: 1; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; background: transparent; transition: 0.3s; }
        .mode-btn.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--primary); }

        .search-card { background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 6px solid var(--primary); }
        .search-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input, select { flex: 1; border: 2px solid #e2e8f0; padding: 12px; border-radius: 12px; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); }
        
        .adv-search-area { display: none; flex-direction: column; gap: 12px; }
        .adv-search-area.active { display: flex; }
        .dept-input-row { display: flex; gap: 5px; align-items: center; }
        .remove-btn { background: #fee2e2; color: #ef4444; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }

        button.main-btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; margin-top: 10px; }
        button.main-btn:hover { background: #0369a1; }
        
        .status { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 12px; }

        /* 結果顯示 */
        .student-wrapper { margin-bottom: 15px; border-radius: 20px; overflow: hidden; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .student-header { background: linear-gradient(135deg, #0284c7, #075985); color: white; padding: 15px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .student-header h2 { margin: 0; font-size: 20px; }
        .student-content { display: none; padding: 15px; background: #f8fafc; }
        .student-wrapper.active .student-content { display: block; }

        .school-card { background: white; padding: 12px; border-radius: 12px; margin-bottom: 8px; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .type-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-cac { background: #e0f2fe; color: #0369a1; }
        .tag-jctv { background: #dcfce7; color: #166534; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(5px); z-index: 999; }
        .modal-content { background: white; width: 92%; max-width: 450px; margin: 8vh auto; border-radius: 24px; display: flex; flex-direction: column; height: 75vh; }
        .modal-header { padding: 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
        .modal-body { padding: 10px; overflow-y: auto; flex: 1; }
        .list-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f8fafc; cursor: pointer; }

        .hint-text { text-align: center; color: #94a3b8; font-size: 13px; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎓 115學年度聯合查榜系統</h1>
        <div id="dataStatus" class="status">正在載入大數據...</div>
    </header>

    <div class="mode-switcher">
        <button class="mode-btn active" onclick="switchMode('normal')">一般查詢</button>
        <button class="mode-btn" onclick="switchMode('adv')">反向推查 (遺失號碼)</button>
    </div>

    <div class="search-card">
        <!-- 一般查詢介面 -->
        <div id="normalSearch" class="search-group">
            <input type="text" id="userInput" placeholder="輸入姓名(如:葉Ｏ群) 或 8位號碼" onkeydown="if(event.key==='Enter') handleSearch()">
        </div>

        <!-- 進階反查介面 -->
        <div id="advSearch" class="adv-search-area">
            <div style="font-size: 14px; color: #64748b; font-weight: bold;">Step 1: 選擇你的考場</div>
            <select id="siteSelect">
                <option value="">-- 請選擇考場 --</option>
            </select>

            <div style="font-size: 14px; color: #64748b; font-weight: bold; margin-top:10px;">Step 2: 輸入你錄取的校系 (至少填一個)</div>
            <div id="deptInputs">
                <div class="dept-input-row">
                    <input type="text" class="dept-query" placeholder="輸入學校或系名關鍵字..." list="deptList">
                </div>
            </div>
            <button onclick="addDeptInput()" style="background:none; border: 1px dashed #cbd5e1; color: #64748b; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px;">+ 新增錄取志願 (最多12個)</button>
        </div>

        <button id="searchBtn" class="main-btn" onclick="handleSearch()" disabled>立即查詢</button>
    </div>

    <div id="resultArea"></div>
    <div id="footerHint" class="hint-text"></div>
</div>

<!-- 自動完成清單 -->
<datalist id="deptList"></datalist>

<div id="deptModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <div>
                <h3 id="modalTitle" style="margin:0"></h3>
                <div id="modalSubTitle" style="color:#64748b; font-size:14px;"></div>
            </div>
            <button onclick="closeModal()" style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<script>
    const GITHUB_URL = "https://raw.githubusercontent.com/potatosserver/UniCross-115/refs/heads/main/exam_local_db.json";
    
    // 考場清單 (與先前相同)
    const TEST_SITES = [[11000101, 11006036, "臺北市立大同高中"], [11006101, 11009236, "臺北市立建國高中"], [14110101, 14110103, "臺北市立建國高中"], [11009301, 11012736, "臺北市立第一女中"], [11012801, 11016136, "臺北市立西松高中"], [11016201, 11020836, "臺北市立和平高中"], [19110101, 19112608, "國立臺灣大學"], [11020901, 11024836, "國立臺灣師大附中"], [11024901, 11028836, "臺北市立松山高中"], [11028901, 11032836, "臺北市立成淵高中"], [11032901, 11036336, "臺北市立華江高中"], [11036401, 11038836, "國立臺灣師範大學"], [19120101, 19121101, "國立臺灣師範大學"], [11038901, 11041636, "臺北市立中山女高"], [11041701, 11043617, "臺北市立景美女中"], [11043701, 11047536, "臺北市立百齡高中"], [11047601, 11051136, "臺北市立內湖高中"], [11051201, 11054136, "臺北市立木柵高工"], [11054201, 11056836, "新北市立新店高中"], [11056901, 11060336, "臺北市立陽明高中"], [11060401, 11063336, "臺北市立復興高中"], [11063401, 11068336, "國立華僑高中"], [19250101, 19250407, "國立華僑高中"], [11068401, 11073523, "新北市立海山高中"], [14250101, 14250104, "新北市立海山高中"], [11073601, 11078536, "新北市立板橋高中"], [19250501, 19251205, "新北市立板橋高中"], [11078601, 11083536, "新北市立新莊高中"], [19251301, 19251507, "新北市立新莊高中"], [11083601, 11089332, "新北市立丹鳳高中"], [14250201, 14250201, "新北市立丹鳳高中"], [19251601, 19251902, "新北市立丹鳳高中"], [11089401, 11093915, "新北市立新北高中"], [14260101, 14260102, "新北市立新北高中"], [19260101, 19260409, "新北市立新北高中"], [11094001, 11098236, "新北市立三min高中"], [11098301, 11103536, "新北市立永平高中"], [14260201, 14260203, "新北市立永平高中"], [19260501, 19260802, "新北市立永平高中"], [11103601, 11108630, "新北市立錦和高中"], [11108701, 11110136, "新北市立光復高中"], [11110201, 11112716, "國立臺灣海洋大學"], [19300101, 19300401, "國立臺灣海洋大學"], [11112801, 11114936, "國立基隆女中"], [11115001, 11118836, "桃園市立武陵高中"], [14310101, 14310103, "桃園市立武陵高中"], [11118901, 11123336, "桃園市立陽明高中"], [11123401, 11128236, "桃園市立桃園高中"], [11128301, 11131426, "國立北科大附屬桃園農工"], [19310101, 19311001, "國立北科大附屬桃園農工"], [11131501, 11135236, "國立中央大學附屬中壢高中"], [19320101, 19320507, "國立中央大學附屬中壢高中"], [11135301, 11139136, "私立復旦高中"], [11139201, 11143036, "私立育達高中"], [11143101, 11146436, "桃園市立平鎮高中"], [14320101, 14320101, "桃園市立平鎮高中"], [11146501, 11149108, "桃園市立大園國際高中"], [11149201, 11152136, "國立新竹高中"], [17340101, 17340105, "國立新竹高中"], [19340101, 19340708, "國立新竹高中"], [11152201, 11155936, "國立新竹女中"], [14340101, 14340101, "國立新竹女中"], [11156001, 11159636, "私立曙光女中"], [11159701, 11163206, "新竹市立香山高中"], [11163301, 11167622, "國立陽明交大附中"], [11167701, 11171730, "國立苗栗高中"], [19370101, 19370304, "國立苗栗高中"], [11171801, 11176036, "臺中市立文華高中"], [19410101, 19410903, "臺中市立文華高中"], [11176101, 11181236, "臺中市立臺中二中"], [11181301, 11186836, "臺中市立臺中一中"], [11186901, 11191036, "國立中興大學附中"], [11191101, 11195836, "私立明德高中"], [11195901, 11198016, "靜宜大學"], [11198101, 11201636, "臺中市立清水高中"], [19430101, 19430202, "臺中市立清水高中"], [11201701, 11207615, "私立弘文高中"], [14430101, 14430105, "私立弘文高中"], [19430301, 19430305, "私立弘文高中"], [11207701, 11212136, "臺中市立臺中女中"], [11212201, 11216326, "臺中市立惠文高中"], [14440101, 14440102, "臺中市立惠文高中"], [11216401, 11219305, "國立中興高中"], [14460101, 14460101, "國立中興高中"], [19460101, 19460207, "國立中興高中"], [11219401, 11220836, "私立同德高中"], [11220901, 11223615, "國立彰化師範大學"], [19470101, 19470401, "國立彰化師範大學"], [11223701, 11228436, "國立彰化師大附屬高工"], [11228501, 11231419, "國立員林高中"], [14470101, 14470102, "國立員林高中"], [19470501, 19470702, "國立員林高中"], [11231501, 11233936, "國立員林崇實高工"], [11234001, 11237436, "國立斗六高中"], [14510101, 14510101, "國立斗六高中"], [19510101, 19510301, "國立斗六高中"], [11237501, 11240831, "國立虎尾高中"], [11240901, 11246230, "國立嘉義高中"], [14540101, 14540101, "國立嘉義高中"], [11246301, 11250436, "國立嘉義女中"], [19540101, 19540502, "國立嘉義女中"], [11250501, 11253935, "國立臺南一中"], [14610101, 14610102, "國立臺南一中"], [19610101, 19610701, "國立臺南一中"], [11254001, 11259036, "國立臺南二中"], [11259101, 11263136, "國立臺南女中"], [11263201, 11267736, "國立家齊高中"], [11267801, 11272936, "私立長榮高中"], [11273001, 11276208, "國立新營高中"], [19640101, 19640203, "國立新營高中"], [11276301, 11279019, "國立高雄師範大學"], [14710101, 14710103, "國立高雄師範大學"], [19710101, 19711008, "國立高雄師範大學"], [11279101, 11281036, "國立高雄師大附中"], [11281101, 11284536, "高雄市立中正高中"], [11284601, 11289236, "國立鳳新高中"], [11289301, 11294636, "私立道明高中"], [11294701, 11299236, "高雄市立高雄高中"], [11299301, 11303736, "高雄市立高雄女中"], [11303801, 11307631, "高雄市立中山高中"], [11307701, 11312236, "高雄市立左營高中"], [11312301, 11314734, "國立屏東大學"], [19770101, 19770201, "國立屏東大學"], [11314801, 11316436, "國立屏東大學(屏師校區)"], [11316501, 11319836, "國立屏東女中"], [11319901, 11326235, "國立宜蘭大學"], [11326301, 11328436, "國立花蓮高中"], [11328501, 11330514, "國立花蓮女中"], [11330601, 11332810, "國立臺東女中"], [11332901, 11333523, "國立澎湖科技大學"], [11333601, 11334531, "國立金門大學"], [11334601, 11334708, "國立馬祖高中"]];

    let rawData = null;
    let idToIndex = {};
    let nameToIndex = {};
    let deptToIndex = {};
    let allDepts = []; // 用於自動完成
    let currentMode = 'normal';

    window.onload = async () => {
        try {
            const response = await fetch(GITHUB_URL);
            rawData = await response.json();
            buildIndex();
            initForm();
        } catch (e) {
            document.getElementById('dataStatus').innerText = "❌ 資料載入失敗。";
        }
    };

    function buildIndex() {
        const types = { cac: "普通大學", jctv: "科技校院" };
        const deptSet = new Set();

        for (let type in types) {
            const schools = rawData[type];
            for (let sName in schools) {
                for (let dName in schools[sName]) {
                    const ids = schools[sName][dName];
                    const fullDeptName = `${sName} - ${dName}`;
                    const dKey = `${types[type]}-${sName}-${dName}`;
                    
                    deptToIndex[dKey] = ids;
                    deptSet.add(fullDeptName);

                    ids.forEach(id => {
                        if (!idToIndex[id]) idToIndex[id] = [];
                        idToIndex[id].push({ type: types[type], school: sName, dept: dName, dKey: dKey });
                    });
                }
            }
        }
        
        // 建立姓名索引
        for (let id in rawData.name_map) {
            const name = rawData.name_map[id];
            if (!nameToIndex[name]) nameToIndex[name] = [];
            nameToIndex[name].push(id);
        }

        // 填充自動完成清單
        const datalist = document.getElementById('deptList');
        Array.from(deptSet).sort().forEach(d => {
            const opt = document.createElement('option');
            opt.value = d;
            datalist.appendChild(opt);
        });

        document.getElementById('dataStatus').innerText = "✅ 資料已就緒";
        document.getElementById('searchBtn').disabled = false;
    }

    function initForm() {
        // 填充考場選單
        const select = document.getElementById('siteSelect');
        const uniqueSites = [...new Set(TEST_SITES.map(s => s[2]))].sort();
        uniqueSites.forEach(site => {
            const opt = document.createElement('option');
            opt.value = site;
            opt.innerText = site;
            select.appendChild(opt);
        });
    }

    function switchMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.innerText.includes(mode==='normal'?'一般':'反向')));
        document.getElementById('normalSearch').style.display = mode === 'normal' ? 'flex' : 'none';
        document.getElementById('advSearch').className = `adv-search-area ${mode === 'adv' ? 'active' : ''}`;
    }

    function addDeptInput() {
        const container = document.getElementById('deptInputs');
        if (container.children.length >= 12) return;
        const div = document.createElement('div');
        div.className = 'dept-input-row';
        div.style.marginTop = '8px';
        div.innerHTML = `
            <input type="text" class="dept-query" placeholder="輸入學校或系名關鍵字..." list="deptList">
            <button class="remove-btn" onclick="this.parentElement.remove()">×</button>
        `;
        container.appendChild(div);
    }

    function handleSearch() {
        const container = document.getElementById('resultArea');
        container.innerHTML = "";
        
        if (currentMode === 'normal') {
            searchNormal();
        } else {
            searchAdvanced();
        }
    }

    function searchNormal() {
        const query = document.getElementById('userInput').value.trim();
        if (!query) return;

        const isNumeric = /^\d+$/.test(query);
        let ids = [];

        if (isNumeric) {
            ids = idToIndex[query] ? [query] : [];
        } else {
            const masked = maskName(query);
            ids = nameToIndex[masked] || [];
        }

        if (ids.length === 0) {
            container.innerHTML = `<div class="no-result-msg">查無資料，請確認輸入正確。</div>`;
            return;
        }
        render(ids);
    }

    function searchAdvanced() {
        const siteName = document.getElementById('siteSelect').value;
        const deptQueries = Array.from(document.querySelectorAll('.dept-query'))
                                 .map(input => input.value.trim())
                                 .filter(v => v !== "");

        if (!siteName) { alert("請選擇考場！"); return; }
        if (deptQueries.length === 0) { alert("請至少輸入一個錄取校系！"); return; }

        // 1. 找出考場對應的所有准考證範圍
        const ranges = TEST_SITES.filter(s => s[2] === siteName);

        // 2. 找出所有輸入校系的考生聯集
        let candidateIds = new Set();
        deptQueries.forEach(q => {
            // 找出匹配 "學校 - 系名" 的 Key
            for (let dKey in deptToIndex) {
                const display = dKey.split('-').slice(1).join(' - '); // 轉回 "校名 - 系名"
                if (display === q) {
                    deptToIndex[dKey].forEach(id => candidateIds.add(id));
                }
            }
        });

        // 3. 過濾出位在該考場範圍內的考生
        const filteredIds = Array.from(candidateIds).filter(id => {
            const val = parseInt(id);
            return ranges.some(r => val >= r[0] && val <= r[1]);
        });

        if (filteredIds.length === 0) {
            document.getElementById('resultArea').innerHTML = `<div class="no-result-msg">找不到符合條件的學生。</div>`;
        } else {
            render(filteredIds);
        }
    }

    function maskName(name) {
        if (!name || name.length < 2 || name.includes('Ｏ')) return name;
        return name[0] + 'Ｏ' + (name.length > 2 ? name[name.length - 1] : '');
    }

    function getSite(id) {
        const val = parseInt(id);
        const match = TEST_SITES.find(s => val >= s[0] && val <= s[1]);
        return match ? match[2] : "未知考場";
    }

    function render(ids) {
        const container = document.getElementById('resultArea');
        ids.forEach(id => {
            const name = rawData.name_map[id] || "（未公開姓名）";
            const site = getSite(id);
            const depts = idToIndex[id] || [];

            const wrapper = document.createElement('div');
            wrapper.className = `student-wrapper ${ids.length === 1 ? 'active' : ''}`;

            let deptsHtml = depts.map(item => {
                const tagClass = item.type === "普通大學" ? "tag-cac" : "tag-jctv";
                return `
                    <div class="school-card" onclick="openModal('${item.dKey}')">
                        <div>
                            <span class="type-tag ${tagClass}">${item.type}</span>
                            <div style="font-weight:bold;">${item.school}</div>
                            <div style="font-size:13px; color:#64748b;">${item.dept}</div>
                        </div>
                        <span style="color:#cbd5e1">❯</span>
                    </div>
                `;
            }).join('');

            wrapper.innerHTML = `
                <div class="student-header" onclick="this.parentElement.classList.toggle('active')">
                    <div>
                        <h2 style="margin:0">${name}</h2>
                        <div style="font-size:12px; opacity:0.8;">編號: ${id} | 考場: ${site}</div>
                    </div>
                    <span>▼</span>
                </div>
                <div class="student-content">${deptsHtml || '無錄取資料'}</div>
            `;
            container.appendChild(wrapper);
        });
    }

    function openModal(dKey) {
        const ids = deptToIndex[dKey];
        const [type, school, dept] = dKey.split('-');
        document.getElementById('modalTitle').innerText = dept;
        document.getElementById('modalSubTitle').innerText = school;
        
        const body = document.getElementById('modalBody');
        body.innerHTML = "";
        ids.forEach(id => {
            const name = rawData.name_map[id] || "（隱藏）";
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `<span>${name}</span><span style="color:#94a3b8">${id}</span>`;
            div.onclick = () => { closeModal(); render([id]); window.scrollTo(0,0); };
            body.appendChild(div);
        });
        document.getElementById('deptModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('deptModal').style.display = 'none'; }
</script>
</body>
</html>
